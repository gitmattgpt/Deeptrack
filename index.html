<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drawing AR — Rotating Cube</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <!-- encantar.js A-Frame plugin -->
  <script src="https://cdn.jsdelivr.net/npm/encantar.js@1.1.0/dist/encantar-aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; }

    /* The reference image doesn't need to be visible */
    #drawing { display: none; }

    /* Loading / error message */
    #status {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 17px; text-align: center;
      padding: 24px; z-index: 9999;
      background: rgba(0,0,0,0.9);
      transition: opacity 0.4s;
    }
    #status.hidden { display: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading / error overlay -->
  <div id="status">
    <div>
      <div class="spinner"></div>
      <div id="status-text">Starting camera…</div>
    </div>
  </div>

  <!--
    Your reference image. Replace "my-drawing.jpg" with your actual file.
    encantar.js will analyze this image and build a tracker from it.
    Requirements: distinct, detailed, asymmetrical, high-contrast [citation:3].
  -->
  <img id="drawing" src="./my-drawing.jpg" alt="Hand-drawn marker" />

  <a-scene encantar="autoplay: true; stats: false;">
    <!-- AR viewport (required) -->
    <ar-viewport style="width: 100vw; height: 100vh;"></ar-viewport>

    <!-- AR root: children are anchored to physical reality -->
    <ar-root>
      <!--
        reference-image must match the id of the <img> tag above.
        The cube will appear ONLY when that image is detected.
      -->
      <a-entity
        geometry="primitive: box; width: 0.5; height: 0.5; depth: 0.5"
        material="color: #4CC3D9; metalness: 0.2; roughness: 0.6"
        position="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;"
        data-ar-reference-image="drawing"
      ></a-entity>
    </ar-root>

    <!-- AR sources (required): use the rear camera -->
    <ar-sources>
      <ar-camera-source facing="environment"></ar-camera-source>
    </ar-sources>

    <!-- AR trackers: an image tracker with our reference image -->
    <ar-trackers>
      <ar-image-tracker>
        <ar-reference-image id="drawing-tracker" image="#drawing" name="my-drawing"></ar-reference-image>
      </ar-image-tracker>
    </ar-trackers>
  </a-scene>

  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var statusText = document.getElementById('status-text');

      function showStatus(msg) {
        statusText.textContent = msg;
        statusEl.classList.remove('hidden');
      }
      function hideStatus() {
        statusEl.classList.add('hidden');
      }

      // Check support before anything else
      window.addEventListener('load', function () {
        if (typeof AR === 'undefined') {
          showStatus('encantar.js failed to load. Check the script tag.');
          return;
        }
        if (!AR.isSupported()) {
          showStatus(
            'This device is not compatible with encantar.js.\n\n' +
            navigator.userAgent
          );
          return;
        }
        // Camera permission will be requested automatically by autoplay.
        // Hide the status overlay once the session has started.
        setTimeout(hideStatus, 1500);
      });

      // Hide status once the reference image is found
      var tracker = document.getElementById('drawing-tracker');
      if (tracker) {
        tracker.addEventListener('ar-imagefound', hideStatus);
        tracker.addEventListener('ar-imagelost', function () {});
      }
    })();
  </script>

</body>
</html>
